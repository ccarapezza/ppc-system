; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = ppc-timer

; ── Shared settings across all environments ──────────────────────────────────
[env]
platform = espressif8266
framework = arduino
board_build.filesystem = littlefs
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, default
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
    mathieucarbou/ESPAsyncWebServer@^3.3.10
    bblanchon/ArduinoJson@^7.2.0
    makuna/RTC@^2.4.3
    arduino-libraries/NTPClient@^3.2.1
    arcao/Syslog@^2.0.0
    links2004/WebSockets@^2.6.1
    knolleary/PubSubClient@^2.8

; ── Base device (WiFi + MQTT + captive portal only, no application logic) ────
[env:ppc-base]
board = nodemcuv2
build_src_filter = -<*> +<main_base.cpp>
build_flags = -DPPC_DEVICE_BASE
extra_scripts = scripts/copy_webapp.py

; ── Timer device (ppc-base + relay control + alarm scheduling) ───────────────
[env:ppc-timer]
board = esp12e
build_src_filter = -<*> +<devices/timer/>
build_flags = -DPPC_DEVICE_TIMER
extra_scripts = scripts/copy_webapp.py

; ── THM device (ppc-base + DHT22 sensor + VPD calculation) ──────────────────
[env:ppc-thm]
board = nodemcuv2
build_src_filter = -<*> +<devices/thm/>
build_flags = -DPPC_DEVICE_THM
lib_deps =
    ${env.lib_deps}
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
extra_scripts = scripts/copy_webapp.py
