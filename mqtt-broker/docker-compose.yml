version: '3.7'
services:
  aedes:
    container_name: aedes
    image: moscajs/aedes:latest
    restart: always
    stop_signal: SIGINT
    networks:
      - mqtt
    logging:
      driver: json-file
    command: --config /data/dockerConfig.js
    volumes:
      - ./:/data
    ports:
      - '1883:1883'
  mongo:
    container_name: mongo
    networks:
      - mqtt
    logging:
      driver: json-file
    image: mvertes/alpine-mongo
    volumes:
      - db-data:/data/db
    ports:
      - "27017:27017"
volumes:
  db-data:
    name: db-data
networks:
  mqtt: